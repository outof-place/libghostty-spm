name: Pod Search Tests

# Runs the pinned Ghostty's terminal search unit tests with the patch stack
# applied: the tests a search patch (0020) adds or touches. build.yml
# compiles the library but runs no Zig tests. A push to a pod-native branch
# that changes the patch stack runs it (a dispatch needs the file on main).

on:
  push:
    branches: ["pod-native-*"]
    paths:
      - "Ghostty.ref"
      - "Patches/ghostty/**"
      - ".github/workflows/pod-search-tests.yml"
  workflow_dispatch:
    inputs:
      filter:
        description: "zig build test -Dtest-filter value"
        required: false
        default: "SlidingWindow"
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Clone Ghostty
        run: |
          git clone https://github.com/ghostty-org/ghostty ./References/ghostty-upstream
          git -C ./References/ghostty-upstream checkout "$(tr -d '[:space:]' < Ghostty.ref)"

      - name: Apply Patches
        run: ./Script/apply-patches.sh "$PWD/References/ghostty-upstream"

      - name: Test
        working-directory: References/ghostty-upstream
        env:
          FILTER: ${{ github.event.inputs.filter || 'SlidingWindow' }}
        run: zig build test -Dtest-filter="$FILTER" --summary all
